<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Violets &amp; Vibes — Matches</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400;1,700&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    html { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; text-rendering: optimizeLegibility; }
    :root {
      --bg: #07071a; --violet: #7c3aed; --violet-soft: #a78bfa;
      --violet-faint: rgba(124, 58, 237, 0.15); --pink: #ec4899;
      --orange-title: #f97316; --teal-title: #2dd4bf;
      --text: #ede9fe; --text-muted: #a29dc4; --text-faint: #4c4570;
      --nav-bg: rgba(5, 4, 18, 0.97); --nav-border: rgba(90, 50, 160, 0.35);
      --font-display: 'Playfair Display', Georgia, serif;
      --font-body: 'DM Sans', system-ui, sans-serif;
      --trans: 180ms cubic-bezier(0.16, 1, 0.3, 1);
      --radius-full: 9999px; --radius-xl: 24px; --radius-lg: 16px;
    }
    body {
      font-family: var(--font-body); color: var(--text);
      background-color: var(--bg);
      background-image:
        radial-gradient(ellipse 70% 55% at 20% 65%, rgba(55, 10, 120, 0.6) 0%, transparent 65%),
        radial-gradient(ellipse 55% 45% at 80% 35%, rgba(70, 8, 130, 0.45) 0%, transparent 60%),
        radial-gradient(ellipse 90% 60% at 50% 100%, rgba(35, 8, 80, 0.55) 0%, transparent 65%);
      display: flex; flex-direction: column; min-height: 100dvh; overflow: hidden; position: relative;
    }
    button { cursor: pointer; background: none; border: none; font: inherit; color: inherit; }
    img { display: block; max-width: 100%; }
    #star-canvas { position: fixed; inset: 0; pointer-events: none; z-index: 0; }
    .floral-panel { position: fixed; top: 0; bottom: 0; width: clamp(130px, 18vw, 220px); z-index: 1; pointer-events: none; }
    .floral-panel img { width: 100%; height: 100%; object-fit: cover; object-position: center top; }
    .floral-left { left: 0; }
    .floral-right { right: 0; transform: scaleX(-1); }
    .floral-left::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, transparent 50%, #07071a 100%); }
    .floral-right::after { content: ''; position: absolute; inset: 0; background: linear-gradient(to left, transparent 50%, #07071a 100%); }
    .moon { position: fixed; left: clamp(100px, 15vw, 220px); top: clamp(100px, 18vh, 200px); width: clamp(50px, 6vw, 80px); z-index: 2; pointer-events: none; opacity: 0.82; }
    .moon-shape { width: 100%; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 38% 44%, #d4b84a 0%, #b89930 45%, #8a7020 100%); box-shadow: 0 0 18px rgba(200, 170, 50, 0.35); position: relative; }
    .moon-shape::after { content: ''; position: absolute; top: -4%; left: 20%; width: 82%; height: 108%; border-radius: 50%; background: #07071a; }
    .sparkle-cross { position: fixed; pointer-events: none; z-index: 2; color: rgba(200, 180, 255, 0.6); font-size: 1rem; font-weight: 700; animation: sparkle-pulse var(--sp-dur, 4s) var(--sp-delay, 0s) ease-in-out infinite; }
    @keyframes sparkle-pulse { 0%, 100% { opacity: 0; transform: scale(0.5); } 50% { opacity: 1; transform: scale(1); } }
    .rainbow-bar { height: 3px; background: linear-gradient(90deg, #ff4d6d 0%, #ff7043 13%, #ffd600 26%, #69f0ae 39%, #00e5ff 52%, #7c4dff 65%, #ea80fc 78%, #ff4d6d 100%); position: relative; z-index: 10; flex-shrink: 0; }
    .header { display: flex; align-items: center; justify-content: space-between; padding: 10px 16px 8px; position: relative; z-index: 10; flex-shrink: 0; background: rgba(5, 3, 16, 0.55); backdrop-filter: blur(10px); }
    .safety-badge { display: flex; align-items: center; gap: 6px; background: rgba(60, 30, 110, 0.5); border: 1px solid rgba(130, 80, 220, 0.35); border-radius: var(--radius-full); padding: 5px 12px 5px 9px; font-size: 0.76rem; font-weight: 500; color: var(--text-muted); transition: background var(--trans), border-color var(--trans); }
    .safety-badge:hover { background: rgba(90, 50, 160, 0.6); border-color: rgba(160, 110, 255, 0.55); }
    .shield-icon { width: 14px; height: 16px; background: var(--violet-soft); clip-path: polygon(50% 0%, 100% 20%, 100% 60%, 50% 100%, 0% 60%, 0% 20%); flex-shrink: 0; opacity: 0.85; }
    .brand-title { font-family: var(--font-display); font-size: clamp(1.45rem, 4.5vw, 2.1rem); font-weight: 700; font-style: italic; letter-spacing: 0.01em; background: linear-gradient(100deg, var(--orange-title) 0%, #fbbf24 35%, var(--teal-title) 100%); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; line-height: 1; white-space: nowrap; }
    .header-right { display: flex; align-items: center; gap: 10px; }
    .online-dot { width: 10px; height: 10px; border-radius: 50%; background: #34d399; box-shadow: 0 0 8px rgba(52, 211, 153, 0.9); animation: pulse-dot 2.4s ease-in-out infinite; }
    @keyframes pulse-dot { 0%, 100% { box-shadow: 0 0 6px rgba(52, 211, 153, 0.8); } 50% { box-shadow: 0 0 16px rgba(52, 211, 153, 1); } }
    .menu-btn { display: flex; flex-direction: column; gap: 4px; padding: 4px; }
    .menu-btn span { display: block; width: 20px; height: 2px; background: var(--text-muted); border-radius: 2px; transition: background var(--trans); }
    .menu-btn:hover span { background: var(--text); }
    .subnav { display: flex; align-items: center; gap: 8px; padding: 8px 16px; position: relative; z-index: 10; flex-shrink: 0; }
    .nav-btn { display: flex; align-items: center; gap: 5px; background: rgba(50, 25, 100, 0.55); border: 1px solid rgba(110, 65, 190, 0.4); border-radius: var(--radius-full); padding: 6px 14px; font-size: 0.82rem; font-weight: 500; color: var(--text-muted); transition: background var(--trans), color var(--trans), border-color var(--trans); }
    .nav-btn:hover { background: rgba(80, 45, 150, 0.7); color: var(--text); border-color: rgba(160, 100, 255, 0.6); }
    .chevron { display: inline-block; width: 7px; height: 7px; border-right: 2px solid currentColor; border-bottom: 2px solid currentColor; opacity: 0.8; }
    .chevron-left { transform: rotate(135deg); }
    .chevron-right { transform: rotate(-45deg); }
    .main { flex: 1; display: flex; align-items: center; justify-content: center; padding: clamp(10px, 3vh, 32px) 16px clamp(10px, 2vh, 20px); position: relative; z-index: 5; min-height: 0; }
    .matches-card { background: rgba(14, 9, 42, 0.68); border: 1px solid rgba(100, 60, 180, 0.28); border-radius: var(--radius-xl); padding: clamp(20px, 4vw, 36px) clamp(20px, 5vw, 44px); width: min(520px, 100%); display: flex; flex-direction: column; align-items: center; backdrop-filter: blur(18px); box-shadow: 0 0 0 1px rgba(110, 55, 200, 0.1), 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(180, 140, 255, 0.05); position: relative; overflow: hidden; }
    .matches-card::before { content: ''; position: absolute; inset: 0; border-radius: inherit; background: radial-gradient(ellipse 65% 45% at 50% -5%, rgba(120, 60, 240, 0.07) 0%, transparent 70%); pointer-events: none; }
    .illustration-wrap { width: clamp(180px, 40vw, 260px); aspect-ratio: 3/4; position: relative; margin-bottom: 14px; flex-shrink: 0; }
    .illustration-wrap img { width: 100%; height: 100%; object-fit: contain; object-position: center; }
    .heart { position: absolute; pointer-events: none; font-size: 1.25rem; line-height: 1; opacity: 0; animation: heart-float var(--hd, 3.5s) var(--hdelay, 0s) ease-in-out infinite; z-index: 2; }
    .heart-pink   { top: 8%;  right: -8%; color: #f472b6; --hd: 3.2s; --hdelay: 0s; font-size: 1.35rem; }
    .heart-violet { top: 20%; right: -2%; color: #a78bfa; --hd: 4.1s; --hdelay: 0.9s; font-size: 1.05rem; }
    @keyframes heart-float { 0%, 100% { opacity: 0; transform: translateY(4px) scale(0.75); } 35%, 65% { opacity: 1; transform: translateY(-6px) scale(1); } }
    .matches-row { display: flex; align-items: center; gap: 7px; margin-bottom: 10px; }
    .heart-icon { width: 18px; height: 16px; position: relative; flex-shrink: 0; }
    .heart-icon::before, .heart-icon::after { content: ''; position: absolute; width: 10px; height: 16px; background: #c026d3; border-radius: 10px 10px 0 0; }
    .heart-icon::before { left: 4px; transform: rotate(-45deg); transform-origin: 0 100%; }
    .heart-icon::after  { left: 4px; transform: rotate(45deg);  transform-origin: 100% 100%; }
    .matches-label { font-family: var(--font-display); font-size: 1.05rem; font-style: italic; color: var(--violet-soft); letter-spacing: 0.02em; }
    .no-matches-title { font-family: var(--font-body); font-size: clamp(1.3rem, 3.5vw, 1.65rem); font-weight: 700; color: var(--text); text-align: center; margin-bottom: 9px; line-height: 1.2; }
    .no-matches-sub { font-size: 0.88rem; color: var(--text-muted); text-align: center; line-height: 1.5; max-width: 30ch; }
    .divider-row { display: flex; align-items: center; gap: 10px; width: 100%; margin-top: 20px; }
    .divider-line { flex: 1; height: 1px; background: linear-gradient(90deg, transparent, rgba(130, 80, 200, 0.4), transparent); }
    .flower-dot-char { color: #7c3aed; font-size: 1rem; animation: spin-slow 10s linear infinite; display: inline-block; filter: drop-shadow(0 0 3px rgba(124, 58, 237, 0.7)); }
    @keyframes spin-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
    .bottom-nav { background: var(--nav-bg); border-top: 1px solid var(--nav-border); display: flex; align-items: stretch; justify-content: space-around; padding: 8px 2px 14px; position: relative; z-index: 10; flex-shrink: 0; backdrop-filter: blur(14px); }
    .nav-item { display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 4px 5px; border-radius: var(--radius-lg); cursor: pointer; min-width: 44px; text-decoration: none; color: inherit; transition: background var(--trans); -webkit-tap-highlight-color: transparent; }
    .nav-item:hover { background: rgba(100, 55, 180, 0.15); }
    .nav-icon { width: 22px; height: 22px; display: flex; align-items: center; justify-content: center; position: relative; }
    .icon-discover::before { content: ''; width: 13px; height: 13px; border: 2px solid currentColor; border-radius: 50%; position: absolute; top: 1px; left: 1px; }
    .icon-discover::after  { content: ''; width: 6px; height: 2px; background: currentColor; position: absolute; bottom: 2px; right: 1px; transform: rotate(-45deg); transform-origin: right center; }
    .icon-violets { font-size: 1.25rem; line-height: 1; }
    .icon-vibes::before { content: ''; width: 0; height: 0; border-top: 7px solid transparent; border-bottom: 7px solid transparent; border-left: 12px solid currentColor; position: absolute; left: 5px; }
    .icon-chat::before { content: ''; width: 16px; height: 13px; border: 2px solid currentColor; border-radius: 6px 6px 6px 0; position: absolute; top: 2px; left: 3px; }
    .icon-social::before { content: ''; width: 8px; height: 8px; border: 2px solid currentColor; border-radius: 50%; position: absolute; top: 0; left: 1px; }
    .icon-social::after  { content: ''; width: 12px; height: 8px; border: 2px solid currentColor; border-radius: 6px 6px 0 0; border-bottom: none; position: absolute; bottom: 0; left: 0; }
    .icon-alerts::before { content: ''; width: 14px; height: 13px; border: 2px solid currentColor; border-radius: 8px 8px 0 0; border-bottom: none; position: absolute; top: 1px; left: 4px; }
    .icon-alerts::after  { content: ''; width: 6px; height: 2px; border-radius: 2px; background: currentColor; position: absolute; bottom: 3px; left: 8px; }
    .icon-profile::before { content: ''; width: 9px; height: 9px; border: 2px solid currentColor; border-radius: 50%; position: absolute; top: 1px; left: 6px; }
    .icon-profile::after  { content: ''; width: 16px; height: 9px; border: 2px solid currentColor; border-radius: 10px 10px 0 0; border-bottom: none; position: absolute; bottom: 1px; left: 3px; }
    .nav-label { font-size: 0.67rem; font-weight: 500; color: var(--text-faint); transition: color var(--trans); }
    .nav-icon, .nav-icon::before, .nav-icon::after { color: var(--text-faint); }
    .nav-item.active .nav-icon, .nav-item.active .nav-icon::before, .nav-item.active .nav-icon::after { color: var(--violet-soft); }
    .nav-item.active .icon-violets { color: var(--violet-soft); }
    .nav-item.active .nav-label { color: var(--violet-soft); }
    .nav-item.active .nav-icon-wrap { background: rgba(124, 58, 237, 0.2); border-radius: 50%; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
  <canvas id="star-canvas"></canvas>
  <div class="floral-panel floral-left"  aria-hidden="true"><img src="vv-floral-left.png"  alt="" /></div>
  <div class="floral-panel floral-right" aria-hidden="true"><img src="vv-floral-right.png" alt="" /></div>
  <div class="moon" aria-hidden="true"><div class="moon-shape"></div></div>
  <div class="sparkle-cross" style="top:14%;left:28%;--sp-dur:3.8s;--sp-delay:0s">+</div>
  <div class="sparkle-cross" style="top:10%;right:22%;--sp-dur:4.5s;--sp-delay:1.2s">✦</div>
  <div class="sparkle-cross" style="top:22%;right:12%;--sp-dur:5s;--sp-delay:0.4s">+</div>
  <div class="sparkle-cross" style="top:38%;left:32%;--sp-dur:6s;--sp-delay:2s">✦</div>
  <div class="sparkle-cross" style="bottom:28%;right:28%;--sp-dur:4.2s;--sp-delay:0.7s">+</div>
  <div class="sparkle-cross" style="bottom:18%;left:36%;--sp-dur:5.5s;--sp-delay:1.8s">✦</div>
  <div class="sparkle-cross" style="top:55%;right:20%;--sp-dur:3.5s;--sp-delay:2.5s">+</div>
  <div class="rainbow-bar" role="presentation"></div>
  <header class="header">
    <button class="safety-badge" aria-label="Safety Standards">
      <div class="shield-icon" aria-hidden="true"></div>
      Safety Standards
    </button>
    <h1 class="brand-title">Violets &amp; Vibes</h1>
    <div class="header-right">
      <div class="online-dot" aria-label="You are online"></div>
      <button class="menu-btn" aria-label="Open menu"><span></span><span></span><span></span></button>
    </div>
  </header>
  <nav class="subnav" aria-label="Page navigation">
    <button class="nav-btn" id="back-btn"><span class="chevron chevron-left" aria-hidden="true"></span>Back</button>
    <button class="nav-btn" id="next-btn">Next<span class="chevron chevron-right" aria-hidden="true"></span></button>
  </nav>
  <main class="main" aria-label="Matches page">
    <div class="matches-card" role="region" aria-label="Your matches">
      <div class="illustration-wrap">
        <img src="vv-center-illustration.png" alt="Woman silhouette with violet flowers" />
        <div class="heart heart-pink"   aria-hidden="true">❤️</div>
        <div class="heart heart-violet" aria-hidden="true">💜</div>
      </div>
      <div class="matches-row">
        <div class="heart-icon" aria-hidden="true"></div>
        <span class="matches-label">Matches</span>
      </div>
      <p class="no-matches-title">No matches yet.</p>
      <p class="no-matches-sub">Keep connecting and check back soon.</p>
      <div class="divider-row" aria-hidden="true">
        <div class="divider-line"></div>
        <span class="flower-dot-char">✿</span>
        <div class="divider-line"></div>
      </div>
    </div>
  </main>
  <nav class="bottom-nav" aria-label="Main navigation">
    <a href="discover.html" class="nav-item" aria-label="Discover"><div class="nav-icon icon-discover"></div><span class="nav-label">Discover</span></a>
    <a href="matches.html" class="nav-item active" aria-label="Violets" aria-current="page">
      <div class="nav-icon-wrap"><div class="nav-icon icon-violets" aria-hidden="true">💜</div></div>
      <span class="nav-label">Violets</span>
    </a>
    <a href="matches.html" class="nav-item" aria-label="Vibes"><div class="nav-icon icon-vibes"></div><span class="nav-label">Vibes</span></a>
    <a href="chat.html" class="nav-item" aria-label="Chat"><div class="nav-icon icon-chat"></div><span class="nav-label">Chat</span></a>
    <a href="social.html" class="nav-item" aria-label="Social"><div class="nav-icon icon-social"></div><span class="nav-label">Social</span></a>
    <a href="alerts.html" class="nav-item" aria-label="Alerts"><div class="nav-icon icon-alerts"></div><span class="nav-label">Alerts</span></a>
    <a href="profile.html" class="nav-item" aria-label="Profile"><div class="nav-icon icon-profile"></div><span class="nav-label">Profile</span></a>
  </nav>
  <script>
    (function () {
      const canvas = document.getElementById('star-canvas');
      const ctx = canvas.getContext('2d');
      function resize() { canvas.width = window.innerWidth; canvas.height = window.innerHeight; }
      resize(); window.addEventListener('resize', resize);
      const stars = Array.from({ length: 90 }, () => ({ x: Math.random(), y: Math.random(), r: Math.random() * 1.4 + 0.3, phase: Math.random() * Math.PI * 2, speed: 0.4 + Math.random() * 0.8, maxOp: 0.25 + Math.random() * 0.65 }));
      const crosses = Array.from({ length: 8 }, () => ({ x: 0.05 + Math.random() * 0.9, y: 0.05 + Math.random() * 0.85, size: 3 + Math.random() * 4, phase: Math.random() * Math.PI * 2, speed: 0.2 + Math.random() * 0.4, maxOp: 0.35 + Math.random() * 0.5 }));
      let last = 0;
      function draw(ts) {
        const dt = (ts - last) / 1000; last = ts;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        stars.forEach(s => { s.phase += s.speed * dt * Math.PI * 2; const op = s.maxOp * (0.5 + 0.5 * Math.sin(s.phase)); ctx.beginPath(); ctx.arc(s.x * canvas.width, s.y * canvas.height, s.r, 0, Math.PI * 2); ctx.fillStyle = `rgba(220, 200, 255, ${op})`; ctx.fill(); });
        crosses.forEach(c => { c.phase += c.speed * dt * Math.PI * 2; const op = c.maxOp * (0.5 + 0.5 * Math.sin(c.phase)); const cx = c.x * canvas.width, cy = c.y * canvas.height, sz = c.size; ctx.strokeStyle = `rgba(200, 180, 255, ${op})`; ctx.lineWidth = 1.5; ctx.lineCap = 'round'; ctx.beginPath(); ctx.moveTo(cx - sz, cy); ctx.lineTo(cx + sz, cy); ctx.moveTo(cx, cy - sz); ctx.lineTo(cx, cy + sz); ctx.stroke(); });
        requestAnimationFrame(draw);
      }
      requestAnimationFrame(draw);
    })();
    document.querySelectorAll('.nav-item').forEach(item => { item.addEventListener('click', function (e) { if (this.getAttribute('href') === '#') e.preventDefault(); document.querySelectorAll('.nav-item').forEach(n => { n.classList.remove('active'); n.removeAttribute('aria-current'); }); this.classList.add('active'); this.setAttribute('aria-current', 'page'); }); });
    document.getElementById('back-btn').addEventListener('click', () => history.back());
    document.getElementById('next-btn').addEventListener('click', () => console.log('next'));
  </script>
</body>
</html>
